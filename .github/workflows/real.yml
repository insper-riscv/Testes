name: real tests (FPGA)

on:
  push:
    branches: [main]     # <<< ADJUST if the default branch isn't main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret FPGA_RUN_SECRET's value, to confirm you're allowed to run this on the physical FPGA"
        required: true

concurrency:
  # Queue instead of overlapping/canceling: cancel-in-progress could
  # kill a run mid quartus_pgm/JTAG write and leave the board or the
  # In-System Memory Editor session in a bad state. Unlike sim.yml,
  # this must NOT cancel-in-progress.
  group: real-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-real:
    # Only runs on main (or on demand) — needs licensed Quartus and
    # real hardware attached over JTAG, so it stays off feature
    # branches/PRs by default.
    runs-on: [self-hosted, quartus, fpga]   # <<< ADJUST to match your runner's labels

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already
        # gates who can trigger this, but on a repo shared with people
        # who shouldn't touch the hardware, this adds a second check —
        # only someone who separately knows FPGA_RUN_SECRET can run it.
        # A push to main skips this: branch protection on main is the
        # gate for that path instead.
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "${{ secrets.FPGA_RUN_SECRET }}" ]; then
            echo "::error::confirmation does not match FPGA_RUN_SECRET — refusing to run on the FPGA"
            exit 1
          fi

      # Non-recursive — see sim.yml for why: tools/Tools's own
      # vendor/riscv-gnu-toolchain and vendor/riscv-isa-sim submodules
      # (multi-GB, only needed by `generate-golden`/spike, never
      # called here) would otherwise be pulled in too.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Checkout RV32IM (holds the real Quartus project)
        # config.yaml's quartus.project_dir is "../tests/FPGA/core/quartus",
        # relative to this checkout — true by accident on a workstation
        # where this repo is nested at RV32IM/Tests/ (see
        # HARDWARE_PROGRAMMING.md), so "../tests" IS RV32IM's own tests/
        # directly, no "RV32IM" path segment in between. A bare CI
        # checkout of just this repo has no such parent, so without the
        # symlink below Quartus fails with "Top-level design entity
        # 'core_fpga_test' is undefined" (it's compiling an empty/wrong
        # directory). RV32IM is public, no auth needed to clone it.
        run: |
          rm -rf ../RV32IM
          git clone --depth 1 https://github.com/insper-riscv/RV32IM.git ../RV32IM
          # This self-hosted runner's _work isn't wiped between runs
          # (unlike a hosted runner), so a stale ../tests left over
          # from before this symlink existed (a real directory, not a
          # symlink) makes `ln -s` create the link *inside* it instead
          # of replacing it — always start from a clean slate.
          rm -rf ../tests
          ln -s RV32IM/tests ../tests

      - name: Add Quartus to PATH
        # <<< ADJUST if Quartus is installed somewhere else on the
        # runner. Reached via /opt/altera_lite (a bind mount of
        # /home/picow/altera_lite in /etc/fstab), not the /home/picow
        # path directly — /home/picow is 750, and the runner user
        # deliberately isn't in the picow group, so it can't traverse
        # there at all.
        run: echo "/opt/altera_lite/25.1std/quartus/bin" >> "$GITHUB_PATH"

      - name: Install RISC-V toolchain (riscv-collab, cached until a newer nightly exists)
        # Same "always latest, no pinned tag" reasoning as sim.yml, but
        # this runner is a persistent machine (sim.yml's isn't), so the
        # ~200MB tarball only needs re-fetching when the nightly tag
        # actually changed — the ~1KB API check runs every time either way.
        # <<< ADJUST the ubuntu-22.04 asset below if this runner's OS
        # ever changes — riscv-collab's prebuilt gcc needs a glibc at
        # least as new as the Ubuntu version it was built against
        # (confirmed via `lsb_release -a` / `ldd --version` on this
        # workstation: Ubuntu 22.04, glibc 2.35 — the 24.04 build
        # failed with "GLIBC_2.38 not found").
        #
        # /opt/riscv-foundation is a shared, workstation-wide cache for
        # every RISC-V toolchain this project needs (not just this
        # one) — owned by runner:runner, setgid so picow (in the
        # runner group) can also refresh it interactively for local
        # dev, instead of each keeping a separate multi-GB copy.
        run: |
          CACHE_DIR=/opt/riscv-foundation/riscv32-elf
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/riscv-collab/riscv-gnu-toolchain/releases/latest)
          LATEST_TAG=$(echo "$RELEASE_JSON" | grep -m1 '"tag_name"' | cut -d'"' -f4)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::could not resolve the latest riscv-collab release tag"
            exit 1
          fi

          if [ "$(cat "$CACHE_DIR/.tag" 2>/dev/null)" = "$LATEST_TAG" ]; then
            echo "Cached toolchain is already $LATEST_TAG, skipping download"
          else
            echo "Installing $LATEST_TAG (cached was: $(cat "$CACHE_DIR/.tag" 2>/dev/null || echo none))"
            rm -rf "$CACHE_DIR" && mkdir -p "$CACHE_DIR"
            curl -fsSL -o /tmp/riscv-gcc.tar.xz \
              "https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/$LATEST_TAG/riscv32-elf-ubuntu-22.04-gcc.tar.xz"
            tar -xf /tmp/riscv-gcc.tar.xz -C "$CACHE_DIR" --strip-components=1
            rm /tmp/riscv-gcc.tar.xz
            echo "$LATEST_TAG" > "$CACHE_DIR/.tag"
          fi
          echo "$CACHE_DIR/bin" >> "$GITHUB_PATH"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python dependencies (riscv-tools, editable from tools/Tools)
        run: uv sync

      - name: Generate rv32_test.h
        run: uv run riscv-tools --config tools/riscv_build/config.yaml generate-header

      - name: Build real test ROM images
        run: uv run riscv-tools --config tools/riscv_build/config.yaml compile --emit mif

      - name: Run tests on the FPGA
        run: uv run riscv-tools --config tools/riscv_build/config.yaml run
