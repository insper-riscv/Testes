name: sim tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sim:
    # Needs no hardware and no Quartus license (GHDL is open source), so
    # it runs on a GitHub-hosted runner, independent of any workstation.
    # insper-riscv/Infra's ELF image has GHDL, the RISC-V GCC with
    # picolibc, Spike and uv already on PATH, so nothing is built or
    # installed here. It is the latest publication; to pin one, use its
    # sha- tag.
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/insper-riscv/ci-elf:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Checkout Core, Memory, Peripherals and TopLevel
        # config.yaml extends ../../../TopLevel/platforms/internal-mem/config.yaml, and
        # the platform's paths are relative to this project's root:
        # "../Core/..." (the core), "../Memory/..." (the memories),
        # "../Peripherals/..." (the UART) and "../TopLevel/..." (the
        # simulation top, the runtime and the testbench).
        # True by accident on a workstation where this repo is nested at
        # RV32IM/Tests/ (see TopLevel's docs/HARDWARE_PROGRAMMING.md), but a bare
        # CI checkout of just this repo has no parent: clone the others next to it.
        # main of each, or the branch .github/sibling-branches names (companion pull requests).
        run: .github/scripts/clone-siblings.sh

      - name: Install Python dependencies (cocotb; riscv-tools comes from the image)
        run: uv sync

      - name: Run host-side UART harness tests
        run: /opt/riscv-tools/riscv-tools/bin/python -m unittest discover -s tests/host -v

      - name: Generate rv32_test.h
        run: riscv-tools --config tools/riscv_build/config.yaml generate-header

      - name: Check the memory map against every copy
        # TopLevel's platforms/internal-mem/platform.yaml is the source of truth; the boot ROM,
        # the runtime, the linker flags, config.yaml, the core's VHDL and the
        # Quartus IPs must all agree with it.
        run: riscv-tools --root ../TopLevel check-memory-map --platform platforms/internal-mem/platform.yaml

      - name: Check the SDRAM platform's memory map against every copy
        # Same check for the platform where the SDRAM is the RAM: its runtime, linker flags,
        # config.yaml and the core's VHDL must agree with platforms/sdram/platform.yaml.
        run: riscv-tools --root ../TopLevel check-memory-map --platform platforms/sdram/platform.yaml

      - name: Check the memory map of the SDRAM platform with the FLASH behind the caches
        run: riscv-tools --root ../TopLevel check-memory-map --platform platforms/sdram-flash/platform.yaml

      - name: Build sim test ROM images
        # compile also generates each C memory test's golden under Spike.
        run: riscv-tools --config tools/riscv_build/config.yaml compile --emit hex

      - name: Run sim tests
        # The generic top exposes UART_RX/UART_TX. The same invocation runs
        # uart-tx, uart-echo and uart-errors beside every other program.
        run: riscv-tools --config tools/riscv_build/config.yaml sim

      - name: Existing programs on the SDRAM platform
        # The SDRAM platform adds the 64 MB SDRAM (bridge, controller and chip model of Memory) to the
        # core; these programs do not use it, so every result must be the one of internal-mem. The UART
        # programs need the serial pins of the board top, which this simulation top does not have.
        run: |
          riscv-tools --config tools/riscv_build/config.sdram-regression.yaml generate-header
          riscv-tools --config tools/riscv_build/config.sdram-regression.yaml compile --emit hex
          riscv-tools --config tools/riscv_build/config.sdram-regression.yaml sim \
            --exclude uart-echo,uart-tx,uart-errors

      - name: Programs that use the SDRAM
        # c-sdram/: self-checking programs (the data and address bus, byte and halfword accesses,
        # copies, loops, multiply and divide with operands in the SDRAM, refresh).
        # flash-const needs the FLASH chip of the sdram-flash platform, hex-id waits for a person to read the
        # display, and cpi-kernels measures with the FLASH behind the caches: the steps below run them.
        run: |
          riscv-tools --config tools/riscv_build/config.sdram.yaml compile --emit hex
          riscv-tools --config tools/riscv_build/config.sdram.yaml sim \
            --exclude flash-const,hex-id,cpi-kernels

      - name: Existing programs on the platform with the FLASH behind the caches
        # The FLASH is a chip at 0x20000000 reached through the instruction and data caches; every result
        # must be the one of internal-mem. The UART programs need the physical pins of the board top.
        run: |
          riscv-tools --config tools/riscv_build/config.sdram-flash-regression.yaml generate-header
          riscv-tools --config tools/riscv_build/config.sdram-flash-regression.yaml compile --emit hex
          riscv-tools --config tools/riscv_build/config.sdram-flash-regression.yaml sim \
            --exclude uart-echo,uart-tx,uart-errors

      - name: Programs that use the SDRAM, with the FLASH behind the caches
        run: |
          riscv-tools --config tools/riscv_build/config.sdram-flash.yaml compile --emit hex
          riscv-tools --config tools/riscv_build/config.sdram-flash.yaml sim --exclude cpi-kernels,hex-id

      - name: The same programs with a slow FLASH chip
        # 120 clocks to the first word and 20 between the others, against 24 and 4: nothing may depend on the latency.
        run: |
          riscv-tools --config tools/riscv_build/config.sdram-flash-slow.yaml sim \
            --only flash-const,cache-sweep,code-sweep,selfmod-repeat,sdram-copy,sdram-loop

      - name: Run per-entity VHDL unit tests (tests/python/)
        run: uv run python tests/python/runner.py

      - name: Upload waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: waveforms
          path: "**/*.ghw"
          if-no-files-found: ignore
