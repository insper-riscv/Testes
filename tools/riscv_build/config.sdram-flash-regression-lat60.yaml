# The existing programs on the platform with the FLASH behind the caches, with a FLASH chip of 60 clocks to
# the first word and 10 between the others.
extends: config.sdram-flash-regression.yaml

sim:
  parameters:
    FLASH_FIRST_LATENCY: "60"
    FLASH_NEXT_LATENCY: "10"
  env:
    SIM_TIMEOUT_CYCLES: "6000000"
