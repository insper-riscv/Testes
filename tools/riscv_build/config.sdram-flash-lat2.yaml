# The programs that use the SDRAM, on the platform with the FLASH behind the caches, with a FLASH chip of
# 2 clocks to the first word and 2 between the others: the result must not depend on the latency.
extends: config.sdram-flash.yaml

sim:
  parameters:
    FLASH_FIRST_LATENCY: "2"
    FLASH_NEXT_LATENCY: "2"
  env:
    SIM_TIMEOUT_CYCLES: "6000000"
