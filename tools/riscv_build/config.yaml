# Configuration of this project's test pipeline (the asm/ and c/ programs).
#
# Everything about the machine the tests run on -- toolchain, memory map, Quartus
# project, simulation, runtime -- is the platform's, in insper-riscv/Insper-RISC-V. This
# file extends it and adds only what is the tests'. The platform config is generated by
# `riscv-tools platform sync` from the Insper-RISC-V submodule, with its paths written
# from this project's root (Insper-RISC-V/Core, Insper-RISC-V/Memory, ...).
extends: config.platform-internal-mem.yaml

paths:
  include_dir: tools/riscv_build/include
  build_dir: build
  c_dir: c
  asm_dir: asm
