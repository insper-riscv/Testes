# The existing programs on the platform with the FLASH behind the caches, with a FLASH chip of 2 clocks to
# the first word and 2 between the others.
extends: config.sdram-flash-regression.yaml

sim:
  parameters:
    FLASH_FIRST_LATENCY: "2"
    FLASH_NEXT_LATENCY: "2"
  env:
    SIM_TIMEOUT_CYCLES: "6000000"
