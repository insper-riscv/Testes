# The existing programs on the platform with the FLASH behind the caches, with a FLASH chip of 20 clocks to
# the first word and 4 between the others.
extends: config.sdram-flash-regression.yaml

sim:
  parameters:
    FLASH_FIRST_LATENCY: "20"
    FLASH_NEXT_LATENCY: "4"
  env:
    SIM_TIMEOUT_CYCLES: "6000000"
