# Simulation profile: the REAL hardware top (core_fpga_test), with the real Quartus
# memory IP on Intel's simulation models. The profile itself is the platform's
# (insper-riscv/Insper-RISC-V, docs/pt-br/guide/simulacao.md); this file adds the tests' paths.
#
#   QUARTUS_ROOTDIR=/opt/altera_lite/25.1std/quartus \
#     riscv-tools --config tools/riscv_build/config.fpga-sim.yaml compile --emit mif
#   QUARTUS_ROOTDIR=... \
#     riscv-tools --config tools/riscv_build/config.fpga-sim.yaml sim
extends: config.platform-internal-mem-fpga-sim.yaml

paths:
  include_dir: tools/riscv_build/include
  build_dir: build
  c_dir: c
  asm_dir: asm
