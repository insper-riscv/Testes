[project]
name = "riscv-workstation-tests"
version = "0.1.0"
description = "Real-hardware + simulation test suite for RV32IM, driven by riscv-tools (tools/Tools submodule)."
# Same ceiling as riscv-tools itself (tools/Tools/pyproject.toml) —
# cocotb caps at 3.13, and this project shares one venv with it.
requires-python = ">=3.13,<3.14"
dependencies = [
    # [sim] pulls cocotb/cocotb-tools at the exact versions riscv-tools
    # itself is pinned to — also what tests/python/runner.py's own
    # per-entity cocotb unit tests need, so there's one dependency
    # source instead of two copies that could drift apart.
    "riscv-tools[sim]",
]

[tool.uv]
# Not a distributable package itself — just a project that depends on
# riscv-tools and runs scripts/tests against it.
package = false

[tool.uv.sources]
riscv-tools = { path = "tools/Tools", editable = true }
